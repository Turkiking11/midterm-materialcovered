<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gr 10 Midterm Material Covered</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="main-content">
    <div class="container">
      <header class="header">
        <h1>Midterm Material Covered: Grade 10</h1>
        <input type="text" id="searchInput" placeholder="Search lessons or topics..." />
      </header>
      <p class="informational-text"><i>Site will be updated upon other exam weeks</i></p>

      <div class="filters" id="subjectFilters">
        <button class="pill active" data-subject="all">All</button>
        <button class="pill" data-subject="biology">Biology</button>
        <button class="pill" data-subject="english">English</button>
        <button class="pill" data-subject="chemistry">Chemistry</button>
        <button class="pill" data-subject="arabic">Arabic</button>
        <button class="pill" data-subject="physics">Physics</button>
        <button class="pill" data-subject="math">Math</button>
      </div>

      <main class="grid" id="lessonsGrid">
        <!-- Cards injected by script.js -->
      </main>
    </div>
  </div>

  <footer class="bottom">
    <div class="footer-container">
      <p>&copy; 2026 Turki - Turkiking11</p>
      <a href="https://github.com/Turkiking11" target="_blank" class="github-link">
        <svg class="github-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
        GitHub
      </a>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
